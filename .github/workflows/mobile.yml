# 手機版：檢查、測試、產生 APK。開發機不安裝 Flutter，APK 都在這裡建置。
name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - "tests/golden/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "tests/golden/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ 還沒提交進 repo，先用 flutter create 產生（不會覆蓋 lib/、test/）
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.github.corgi8cm --project-name reporttool_mobile .
            rm -f test/widget_test.dart
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: reporttool-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
